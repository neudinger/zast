<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="587" viewBox="0 0 1280 587" role="img" aria-labelledby="title description">
<title id="title">Build a type from smaller types.</title>
<desc id="description">An optional type wraps a const byte slice to produce OptionalText. Both panes are complete snippets; use the README runner for the description.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.source, .output { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 17px; fill: #f1f4ee; }
</style>
<rect width="1280" height="587" rx="20" fill="#0b1613"/>
<text x="32" y="48" fill="#f1f4ee" font-size="24" font-weight="600">Build a type from smaller types.</text>
<text x="1248" y="47" text-anchor="end" fill="#bac4be" font-size="13" letter-spacing="2">ZAST / TYPE COMPOSITION</text>
<rect x="32" y="80" width="650" height="445" rx="12" fill="#0c1714" stroke="#35463e"/>
<rect x="742" y="80" width="506" height="445" rx="12" fill="#0c1714" stroke="#35463e"/>
<text x="60" y="119" fill="#a1f0d0" font-size="15" font-weight="600">01 / DESCRIBE</text>
<text x="770" y="119" fill="#a1f0d0" font-size="15" font-weight="600">02 / RENDER</text>
<path d="M32 143H682 M742 143H1248" stroke="#35463e"/>
<text class="source" x="60" y="181" xml:space="preserve"><tspan fill="#d29aef">const</tspan> byte_type: <tspan fill="#d29aef">zast</tspan>.<tspan fill="#d29aef">Expression</tspan> = .{</text>
<text class="source" x="60" y="206" xml:space="preserve">    .identifier = <tspan fill="#f29baf">"u8"</tspan>,</text>
<text class="source" x="60" y="231" xml:space="preserve">};</text>
<text class="source" x="60" y="256" xml:space="preserve"><tspan fill="#d29aef">const</tspan> text_type: <tspan fill="#d29aef">zast</tspan>.<tspan fill="#d29aef">Expression</tspan> = .{ .slice_type = .{</text>
<text class="source" x="60" y="281" xml:space="preserve">    .child_type = &amp;byte_type,</text>
<text class="source" x="60" y="306" xml:space="preserve">    .is_const = <tspan fill="#d29aef">true</tspan>,</text>
<text class="source" x="60" y="331" xml:space="preserve">} };</text>
<text class="source" x="60" y="356" xml:space="preserve"><tspan fill="#d29aef">const</tspan> optional_text: <tspan fill="#d29aef">zast</tspan>.<tspan fill="#d29aef">Declaration</tspan> = .{</text>
<text class="source" x="60" y="381" xml:space="preserve">    .value = .{ .optional_type = &amp;text_type },</text>
<text class="source" x="60" y="406" xml:space="preserve">};</text>
<text class="source" x="60" y="431" xml:space="preserve"><tspan fill="#d29aef">try</tspan> optional_text.emit(</text>
<text class="source" x="60" y="456" xml:space="preserve">    allocator, context, <tspan fill="#f29baf">"OptionalText"</tspan>, .public,</text>
<text class="source" x="60" y="481" xml:space="preserve">);</text>
<text class="output" x="770" y="181" xml:space="preserve"><tspan fill="#d29aef">pub</tspan> <tspan fill="#d29aef">const</tspan> <tspan fill="#d29aef">OptionalText</tspan> = ?[]<tspan fill="#d29aef">const</tspan> <tspan fill="#d29aef">u8</tspan>;</text>
<path d="M697 279H726 M718 271L726 279L718 287" fill="none" stroke="#a1f0d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="32" y="561" fill="#bac4be" font-size="15">u8 becomes []const u8, then ?[]const u8.</text>
</svg>
