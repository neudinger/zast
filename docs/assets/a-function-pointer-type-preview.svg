<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="587" viewBox="0 0 1320 587" role="img" aria-labelledby="title description">
<title id="title">A function pointer type</title>
<desc id="description">Function type parameters can omit names. `Expression.fromType` emits the signature without a body; wrapping it in a const pointer creates a callable callback type.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.source, .output { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 17px; fill: #f1f4ee; }
</style>
<rect width="1320" height="587" rx="20" fill="#0b1613"/>
<text x="32" y="48" fill="#f1f4ee" font-size="24" font-weight="600">A function pointer type</text>
<text x="1288" y="47" text-anchor="end" fill="#bac4be" font-size="13" letter-spacing="2">ZAST / FUNCTION TYPES</text>
<rect x="32" y="80" width="680" height="445" rx="12" fill="#0c1714" stroke="#35463e"/>
<text x="60" y="119" fill="#a1f0d0" font-size="15" font-weight="600">01 / DESCRIBE</text>
<path d="M32 143H712" stroke="#35463e"/>
<text class="source" x="60" y="181" xml:space="preserve"><tspan fill="#d29aef">const</tspan> scalar: <tspan fill="#d29aef">zast</tspan>.<tspan fill="#d29aef">Expression</tspan> = .{ .identifier = <tspan fill="#f29baf">"u32"</tspan> };</text>
<text class="source" x="60" y="206" xml:space="preserve"><tspan fill="#d29aef">const</tspan> signature: <tspan fill="#d29aef">zast</tspan>.<tspan fill="#d29aef">FunctionDeclaration</tspan> = .{</text>
<text class="source" x="60" y="231" xml:space="preserve">    .parameters = &amp;.{.{ .type_expression = scalar }},</text>
<text class="source" x="60" y="256" xml:space="preserve">    .return_type = scalar,</text>
<text class="source" x="60" y="281" xml:space="preserve">};</text>
<text class="source" x="60" y="306" xml:space="preserve"><tspan fill="#d29aef">const</tspan> prototype = <tspan fill="#d29aef">zast</tspan>.<tspan fill="#d29aef">Expression</tspan>.fromType(&amp;signature);</text>
<text class="source" x="60" y="331" xml:space="preserve"><tspan fill="#d29aef">const</tspan> callback: <tspan fill="#d29aef">zast</tspan>.<tspan fill="#d29aef">Declaration</tspan> = .{</text>
<text class="source" x="60" y="356" xml:space="preserve">    .value = .{ .pointer_type = .{</text>
<text class="source" x="60" y="381" xml:space="preserve">        .child_type = &amp;prototype,</text>
<text class="source" x="60" y="406" xml:space="preserve">        .is_const = <tspan fill="#d29aef">true</tspan>,</text>
<text class="source" x="60" y="431" xml:space="preserve">    } },</text>
<text class="source" x="60" y="456" xml:space="preserve">};</text>
<text class="source" x="60" y="481" xml:space="preserve"><tspan fill="#d29aef">try</tspan> callback.emit(allocator, context, <tspan fill="#f29baf">"Callback"</tspan>, .public);</text>
<rect x="772" y="80" width="516" height="445" rx="12" fill="#0c1714" stroke="#35463e"/>
<text x="800" y="119" fill="#a1f0d0" font-size="15" font-weight="600">02 / RENDER</text>
<path d="M772 143H1288" stroke="#35463e"/>
<text class="output" x="800" y="181" xml:space="preserve"><tspan fill="#d29aef">pub</tspan> <tspan fill="#d29aef">const</tspan> <tspan fill="#d29aef">Callback</tspan> = *<tspan fill="#d29aef">const</tspan> <tspan fill="#d29aef">fn</tspan> (<tspan fill="#d29aef">u32</tspan>) <tspan fill="#d29aef">u32</tspan>;</text>
<path d="M727 279H756 M748 271L756 279L748 287" fill="none" stroke="#a1f0d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="32" y="561" fill="#bac4be" font-size="15">A borrowed signature composes into a const function pointer.</text>
</svg>
