<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="787" viewBox="0 0 1320 787" role="img" aria-labelledby="title description">
<title id="title">Comments and documentation</title>
<desc id="description">An ordinary comment uses source bytes; file and declaration documentation also use tokens. Every comment ends with a newline.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.source, .output { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 17px; fill: #f1f4ee; }
</style>
<rect width="1320" height="787" rx="20" fill="#0b1613"/>
<text x="32" y="48" fill="#f1f4ee" font-size="24" font-weight="600">Comments and documentation</text>
<text x="1288" y="47" text-anchor="end" fill="#bac4be" font-size="13" letter-spacing="2">ZAST / COMMENTS</text>
<rect x="32" y="80" width="680" height="645" rx="12" fill="#0c1714" stroke="#35463e"/>
<text x="60" y="119" fill="#a1f0d0" font-size="15" font-weight="600">01 / DESCRIBE</text>
<path d="M32 143H712" stroke="#35463e"/>
<text class="source" x="60" y="181" xml:space="preserve"><tspan fill="#d29aef">try</tspan> context.source.appendSlice(</text>
<text class="source" x="60" y="206" xml:space="preserve">    allocator,</text>
<text class="source" x="60" y="231" xml:space="preserve">    <tspan fill="#f29baf">"// Generated by zast.\n"</tspan>,</text>
<text class="source" x="60" y="256" xml:space="preserve">);</text>
<text class="source" x="60" y="281" xml:space="preserve">_ = <tspan fill="#d29aef">try</tspan> context.token(</text>
<text class="source" x="60" y="306" xml:space="preserve">    allocator,</text>
<text class="source" x="60" y="331" xml:space="preserve">    .container_doc_comment,</text>
<text class="source" x="60" y="356" xml:space="preserve">    <tspan fill="#f29baf">"//! Documented declarations."</tspan>,</text>
<text class="source" x="60" y="381" xml:space="preserve">);</text>
<text class="source" x="60" y="406" xml:space="preserve"><tspan fill="#d29aef">try</tspan> context.source.append(allocator, <tspan fill="#f29baf">'\n'</tspan>);</text>
<text class="source" x="60" y="431" xml:space="preserve">_ = <tspan fill="#d29aef">try</tspan> context.token(</text>
<text class="source" x="60" y="456" xml:space="preserve">    allocator,</text>
<text class="source" x="60" y="481" xml:space="preserve">    .doc_comment,</text>
<text class="source" x="60" y="506" xml:space="preserve">    <tspan fill="#f29baf">"/// The default answer."</tspan>,</text>
<text class="source" x="60" y="531" xml:space="preserve">);</text>
<text class="source" x="60" y="556" xml:space="preserve"><tspan fill="#d29aef">try</tspan> context.source.append(allocator, <tspan fill="#f29baf">'\n'</tspan>);</text>
<text class="source" x="60" y="581" xml:space="preserve"><tspan fill="#d29aef">const</tspan> answer: <tspan fill="#d29aef">zast</tspan>.<tspan fill="#d29aef">Declaration</tspan> = .{</text>
<text class="source" x="60" y="606" xml:space="preserve">    .type_expression = .{ .identifier = <tspan fill="#f29baf">"u32"</tspan> },</text>
<text class="source" x="60" y="631" xml:space="preserve">    .value = .{ .integer_literal = <tspan fill="#f29baf">"42"</tspan> },</text>
<text class="source" x="60" y="656" xml:space="preserve">};</text>
<text class="source" x="60" y="681" xml:space="preserve"><tspan fill="#d29aef">try</tspan> answer.emit(allocator, context, <tspan fill="#f29baf">"answer"</tspan>, .public);</text>
<rect x="772" y="80" width="516" height="645" rx="12" fill="#0c1714" stroke="#35463e"/>
<text x="800" y="119" fill="#a1f0d0" font-size="15" font-weight="600">02 / RENDER</text>
<path d="M772 143H1288" stroke="#35463e"/>
<text class="output" x="800" y="181" xml:space="preserve"><tspan fill="#9faea7">// Generated by zast.</tspan></text>
<text class="output" x="800" y="206" xml:space="preserve"><tspan fill="#9faea7">//! Documented declarations.</tspan></text>
<text class="output" x="800" y="231" xml:space="preserve"><tspan fill="#9faea7">/// The default answer.</tspan></text>
<text class="output" x="800" y="256" xml:space="preserve"><tspan fill="#d29aef">pub</tspan> <tspan fill="#d29aef">const</tspan> answer: <tspan fill="#d29aef">u32</tspan> = <tspan fill="#f4ba93">42</tspan>;</text>
<path d="M727 279H756 M748 271L756 279L748 287" fill="none" stroke="#a1f0d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="32" y="761" fill="#bac4be" font-size="15">Comments need source bytes; documentation also needs tokens.</text>
</svg>
