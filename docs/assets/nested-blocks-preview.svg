<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="737" viewBox="0 0 1320 737" role="img" aria-labelledby="title description">
<title id="title">Nested blocks</title>
<desc id="description">`Block.Statement.block` nests a borrowed block. Assignment to `_` discards a value, and a null `return_value` emits a bare `return;`. The default function return type is `void`.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.source, .output { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 17px; fill: #f1f4ee; }
</style>
<rect width="1320" height="737" rx="20" fill="#0b1613"/>
<text x="32" y="48" fill="#f1f4ee" font-size="24" font-weight="600">Nested blocks</text>
<text x="1288" y="47" text-anchor="end" fill="#bac4be" font-size="13" letter-spacing="2">ZAST / BLOCKS</text>
<rect x="32" y="80" width="680" height="595" rx="12" fill="#0c1714" stroke="#35463e"/>
<text x="60" y="119" fill="#a1f0d0" font-size="15" font-weight="600">01 / DESCRIBE</text>
<path d="M32 143H712" stroke="#35463e"/>
<text class="source" x="60" y="181" xml:space="preserve"><tspan fill="#d29aef">const</tspan> inner: <tspan fill="#d29aef">zast</tspan>.<tspan fill="#d29aef">Block</tspan> = .{ .statements = &amp;.{</text>
<text class="source" x="60" y="206" xml:space="preserve">    .{ .declaration = .{</text>
<text class="source" x="60" y="231" xml:space="preserve">        .name = <tspan fill="#f29baf">"value"</tspan>,</text>
<text class="source" x="60" y="256" xml:space="preserve">        .declaration = .{</text>
<text class="source" x="60" y="281" xml:space="preserve">            .value = .{ .integer_literal = <tspan fill="#f29baf">"42"</tspan> },</text>
<text class="source" x="60" y="306" xml:space="preserve">        },</text>
<text class="source" x="60" y="331" xml:space="preserve">    } },</text>
<text class="source" x="60" y="356" xml:space="preserve">    .{ .assignment = .{</text>
<text class="source" x="60" y="381" xml:space="preserve">        .target = .{ .identifier = <tspan fill="#f29baf">"_"</tspan> },</text>
<text class="source" x="60" y="406" xml:space="preserve">        .value = .{ .identifier = <tspan fill="#f29baf">"value"</tspan> },</text>
<text class="source" x="60" y="431" xml:space="preserve">    } },</text>
<text class="source" x="60" y="456" xml:space="preserve">} };</text>
<text class="source" x="60" y="481" xml:space="preserve"><tspan fill="#d29aef">const</tspan> function: <tspan fill="#d29aef">zast</tspan>.<tspan fill="#d29aef">FunctionDeclaration</tspan> = .{</text>
<text class="source" x="60" y="506" xml:space="preserve">    .body = .{ .statements = &amp;.{</text>
<text class="source" x="60" y="531" xml:space="preserve">        .{ .block = &amp;inner },</text>
<text class="source" x="60" y="556" xml:space="preserve">        .{ .return_value = <tspan fill="#d29aef">null</tspan> },</text>
<text class="source" x="60" y="581" xml:space="preserve">    } },</text>
<text class="source" x="60" y="606" xml:space="preserve">};</text>
<text class="source" x="60" y="631" xml:space="preserve"><tspan fill="#d29aef">try</tspan> function.emit(allocator, context, <tspan fill="#f29baf">"noop"</tspan>, .public);</text>
<rect x="772" y="80" width="516" height="595" rx="12" fill="#0c1714" stroke="#35463e"/>
<text x="800" y="119" fill="#a1f0d0" font-size="15" font-weight="600">02 / RENDER</text>
<path d="M772 143H1288" stroke="#35463e"/>
<text class="output" x="800" y="181" xml:space="preserve"><tspan fill="#d29aef">pub</tspan> <tspan fill="#d29aef">fn</tspan> noop() <tspan fill="#d29aef">void</tspan> {</text>
<text class="output" x="800" y="206" xml:space="preserve">    {</text>
<text class="output" x="800" y="231" xml:space="preserve">        <tspan fill="#d29aef">const</tspan> value = <tspan fill="#f4ba93">42</tspan>;</text>
<text class="output" x="800" y="256" xml:space="preserve">        _ = value;</text>
<text class="output" x="800" y="281" xml:space="preserve">    }</text>
<text class="output" x="800" y="306" xml:space="preserve">    <tspan fill="#d29aef">return</tspan>;</text>
<text class="output" x="800" y="331" xml:space="preserve">}</text>
<path d="M727 279H756 M748 271L756 279L748 287" fill="none" stroke="#a1f0d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="32" y="711" fill="#bac4be" font-size="15">Nested scopes hold local declarations, assignments, and returns.</text>
</svg>
