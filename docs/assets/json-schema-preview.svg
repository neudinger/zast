<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="487" viewBox="0 0 1320 487" role="img" aria-labelledby="title description">
<title id="title">JSON schema playground</title>
<desc id="description">Map a JSON schema field to a native Zig field and preserve its default. The playground also adds a fixed example method.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.source, .output { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 17px; fill: #f1f4ee; }
</style>
<rect width="1320" height="487" rx="20" fill="#0b1613"/>
<text x="32" y="48" fill="#f1f4ee" font-size="24" font-weight="600">JSON schema playground</text>
<text x="1288" y="47" text-anchor="end" fill="#bac4be" font-size="13" letter-spacing="2">ZAST / JSON SCHEMA</text>
<rect x="32" y="80" width="680" height="345" rx="12" fill="#0c1714" stroke="#35463e"/>
<text x="60" y="119" fill="#a1f0d0" font-size="15" font-weight="600">01 / JSON OBJECT EXCERPT</text>
<path d="M32 143H712" stroke="#35463e"/>
<text class="source" x="60" y="181" xml:space="preserve">{</text>
<text class="source" x="60" y="206" xml:space="preserve">  <tspan fill="#f29baf">"name"</tspan>: <tspan fill="#f29baf">"Reading"</tspan>,</text>
<text class="source" x="60" y="231" xml:space="preserve">  <tspan fill="#f29baf">"fields"</tspan>: [{</text>
<text class="source" x="60" y="256" xml:space="preserve">    <tspan fill="#f29baf">"name"</tspan>: <tspan fill="#f29baf">"answer"</tspan>,</text>
<text class="source" x="60" y="281" xml:space="preserve">    <tspan fill="#f29baf">"type"</tspan>: {<tspan fill="#f29baf">"base_type"</tspan>: <tspan fill="#f29baf">"UInt"</tspan>},</text>
<text class="source" x="60" y="306" xml:space="preserve">    <tspan fill="#f29baf">"default_integer"</tspan>: <tspan fill="#f4ba93">65</tspan></text>
<text class="source" x="60" y="331" xml:space="preserve">  }]</text>
<text class="source" x="60" y="356" xml:space="preserve">}</text>
<rect x="772" y="80" width="516" height="345" rx="12" fill="#0c1714" stroke="#35463e"/>
<text x="800" y="119" fill="#a1f0d0" font-size="15" font-weight="600">02 / RENDERED ZIG EXCERPT</text>
<path d="M772 143H1288" stroke="#35463e"/>
<text class="output" x="800" y="181" xml:space="preserve"><tspan fill="#d29aef">pub</tspan> <tspan fill="#d29aef">const</tspan> <tspan fill="#d29aef">Reading</tspan> = <tspan fill="#d29aef">struct</tspan> {</text>
<text class="output" x="800" y="206" xml:space="preserve">    answer: <tspan fill="#d29aef">u32</tspan> = <tspan fill="#f4ba93">65</tspan>,</text>
<text class="output" x="800" y="231" xml:space="preserve">    <tspan fill="#d29aef">pub</tspan> <tspan fill="#d29aef">fn</tspan> answerFunc() <tspan fill="#d29aef">u32</tspan> {</text>
<text class="output" x="800" y="256" xml:space="preserve">        <tspan fill="#d29aef">return</tspan> <tspan fill="#f4ba93">84</tspan>;</text>
<text class="output" x="800" y="281" xml:space="preserve">    }</text>
<text class="output" x="800" y="306" xml:space="preserve">};</text>
<path d="M727 279H756 M748 271L756 279L748 287" fill="none" stroke="#a1f0d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="32" y="461" fill="#bac4be" font-size="15">Excerpt: UInt becomes u32. The generator supplies answerFunc.</text>
</svg>
